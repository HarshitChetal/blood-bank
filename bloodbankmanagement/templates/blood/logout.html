{%load static%}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>Logged Out</title>
    <style>
        .logo {
            display: table;
            margin-right: auto;
            margin-left: auto;
        }
        .logout-box {
            background: #fff;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            margin: auto;
        }
        .logout-title {
            font-size: 32px;
            color: #333;
            font-weight: 600;
            margin-top: 20px;
        }
        .btn-login {
            background-color: #FF0018;
            color: white;
            padding: 12px 30px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            margin-top: 25px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-login:hover {
            background-color: #cc0014;
            color: white;
        }
    </style>
</head>
<body>
    {% include "blood/navbar.html" %}
    <br><br><br><br><br>
    
    <div class="container"> 
        <div class="logout-box">
            <div class="logo">
                <img src="{% static 'image/logout.png' %}" alt="logo" style="width: 140px;">
            </div>
            <h2 class="logout-title">Logged Out Successfully</h2>
            <p style="color: #777;">You have been securely signed out of your session.</p>
            
            <a href="/adminlogin" class="btn-login">Login Again</a>
        </div>
    </div>

    <br><br><br>
    {% include "blood/footer.html" %}
</body>
</html>
